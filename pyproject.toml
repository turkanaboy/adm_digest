[project]
name = "adm-digest"
version = "0.1.0"
description = "Daily undergraduate admissions news digest generator"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "openai>=1.84.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
