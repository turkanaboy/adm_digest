    tier: primary
    access: public

  - name: The Atlantic - Education
    url: https://www.theatlantic.com/education/
    rss_url: https://www.theatlantic.com/feed/channel/education/
    category: national_general
    tier: primary
    access: public

  - name: Forbes - Education
    url: https://www.forbes.com/education/
    rss_url: https://www.forbes.com/education/feed/
    category: national_general
    tier: primary
    access: public

  - name: Politico - Education
    url: https://www.politico.com/news/education
    rss_url: https://rss.politico.com/education.xml
    category: national_general
    tier: primary
    access: public
