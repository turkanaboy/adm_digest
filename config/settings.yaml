digest:
  title: Undergraduate Admissions Daily Digest
  institution_context: Binghamton University, a four-year doctoral-granting SUNY institution
  timezone: America/New_York
  max_articles: 5
  per_source_cap: 2
  lookback_hours: 48
  archive_dir: digests
  seen_articles_path: data/seen_articles.json
  include_weekends: false
  binghamton_area_max_items: 4
  resource_max_items: 1
  binghamton_area_tone: positive_recruitment_useful
  disclaimer: >-
    AI-generated briefing for internal admissions awareness. Summaries may omit nuance;
    read the linked source for full context. Quotes are intentionally short excerpts.

email:
  subject_prefix: "Binghamton Admissions Digest"
  from_name: "Binghamton Admissions Digest Bot"
  # Optional externally hosted header image. Leave blank to use the branded color header only.
  header_image_url: ""

slack:
  enabled: false
  # Slack incoming webhooks work on free Slack workspaces if an admin allows the app/webhook.
  # Set SLACK_WEBHOOK_URL in GitHub Actions secrets and change enabled to true to post.

openai:
  model: gpt-4.1-mini
  # Default mode tries public visible full text for stronger summaries/quotes,
  # but falls back to metadata/excerpts for paywalled or inaccessible pages.
  article_context_mode: public_full_text
  context_char_limit: 1200
  # This fetches only public visible text and skips subscription sources.
  public_full_text_max_chars: 12000
